name: CI

# Every push to any branch (main included) runs the full set of checks here
# on GitHub. There is no separate pull_request trigger: a pull request from
# one of this repository's branches already gets the push run, and listing
# both ran everything twice. The website itself only rebuilds when main
# changes (vercel.json: git.deploymentEnabled), so a release branch can be
# pushed and checked as often as needed without a rebuild.

on:
  push:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Pinned: ubuntu-latest moves to 26.04 from 2026-10-19, and Playwright
    # 1.58 does not support it yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Keep this equal to the Node version set in the Vercel project
      # (Settings > Build and Deployment > Node.js Version).
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --quiet

      - name: Type check (app code)
        run: npm run typecheck

      - name: Unit, component and standards tests
        run: npx vitest run
        # Includes the migration standards test: unique numbers, re-runnable
        # DDL and a probe for every new migration.

      - name: Dependency audit (production, critical)
        run: npm audit --omit=dev --audit-level=critical

      - name: Build
        run: npm run build
        # Placeholders only, never secrets. The CI build must not reach the
        # production database: prerendering the /reference pages against
        # production would compete with the Vercel production build for the
        # same database connections (see experimental.cpus in next.config.ts).
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          SENTRY_DSN: ""
          SENTRY_AUTH_TOKEN: ""
          NEXT_PUBLIC_SENTRY_DSN: ""
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          STRIPE_SECRET_KEY: sk_test_placeholder
          RESEND_API_KEY: re_placeholder
